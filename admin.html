<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D'ARK Web Studio — Owner Panel</title>
<link rel="stylesheet" href="admin.css"><script src="site-data.js"></script>
<style>.view{display:none}.view.show{display:block}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#070707}.login-card{width:min(420px,100%);background:#111;border:1px solid #2b2b2b;border-radius:16px;padding:32px;box-shadow:0 20px 60px #000}.login-card h1{margin:0 0 8px;color:#fff}.login-card p{color:#aaa}.login-card input{width:100%;box-sizing:border-box;margin:7px 0 16px;padding:13px;background:#0b0b0b;border:1px solid #333;color:#fff;border-radius:8px}.login-card button{width:100%;padding:13px;border:0;border-radius:8px;cursor:pointer}.login-error{color:#ff8d8d;min-height:20px;margin:8px 0}.top-actions{display:flex;gap:8px;align-items:center}.top-actions button{background:transparent;border:1px solid #333;color:#ddd;padding:8px 11px;border-radius:7px;cursor:pointer}.top-actions button:hover{border-color:#777}.who{color:#aaa;font-size:13px}</style>
</head>
<body>
<div id="loginView" class="view"><div class="login-wrap"><div class="login-card"><div class="brand"><span class="dot"></span><span>D'ARK Web Studio</span></div><h1>Owner Login</h1><p>Sign in to manage the live website.</p><form id="loginForm"><label>Owner Email</label><input id="username" type="email" autocomplete="username" placeholder="owner@example.com" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div id="loginError" class="login-error"></div><button class="btn primary" type="submit">Login</button></form></div></div></div>
<div id="appView" class="view"><div class="admin-shell"><aside class="sidebar"><div class="brand"><span class="dot"></span><span>D'ARK Web Studio</span></div><div class="side-label">OWNER PANEL</div><button class="tab active" data-tab="general">⚙ General</button><button class="tab" data-tab="testimonials">★ Testimonials</button><button class="tab" data-tab="projects">▣ Projects</button><button class="tab" data-tab="services">◈ Services</button><button class="tab" data-tab="team">◉ Team</button><div class="side-bottom"><a href="index.html" target="_blank">↗ Open Website</a><button id="passwordBtn">🔐 Change Password</button><button id="logoutBtn">↪ Logout</button></div></aside><main class="main"><header class="topbar"><div><span class="eyebrow">LIVE CONTROL CENTER</span><h1 id="pageTitle">General Settings</h1></div><div class="top-actions"><span class="who">Owner: <b id="who"></b></span><span class="saved" id="savedStatus">Ready</span></div></header><section id="general" class="panel active"></section><section id="testimonials" class="panel"></section><section id="projects" class="panel"></section><section id="services" class="panel"></section><section id="team" class="panel"></section></main></div></div>
<script src="admin.js"></script></body></html>
